<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ecc8f"/><stop offset="1" stop-color="#00b4d8"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#003399"/></linearGradient>
    <linearGradient id="gbtn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#003399"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe6ff"/><stop offset="1" stop-color="#f4f6ff"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001a5c" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="900" height="640" fill="url(#bg)"/>

  <!-- title -->
  <g transform="translate(40,40)">
    <rect width="40" height="40" rx="11" fill="#003399"/>
    <text x="20" y="28" font-size="24" text-anchor="middle" fill="#ffcc00">★</text>
    <text x="52" y="22" font-size="26" font-weight="800" fill="#003399">Erasmatch<tspan fill="#ffcc00" stroke="#003399" stroke-width="0.5">+</tspan></text>
    <text x="52" y="40" font-size="13" fill="#4a5170">Swipe. Match. Go abroad.</text>
  </g>

  <!-- ===== Onboarding panel ===== -->
  <g transform="translate(40,110)">
    <rect width="380" height="490" rx="22" fill="#fff" filter="url(#sh)"/>
    <text x="190" y="70" font-size="34" text-anchor="middle">🌍✨</text>
    <text x="190" y="110" font-size="22" font-weight="700" text-anchor="middle" fill="#14193a">Find your next adventure</text>
    <text x="190" y="138" font-size="13" text-anchor="middle" fill="#4a5170">Tell us about you, we'll match Erasmus+ projects.</text>

    <text x="32" y="180" font-size="13" font-weight="600" fill="#14193a">Your age</text>
    <rect x="32" y="192" width="316" height="44" rx="14" fill="#fbfcff" stroke="#2f6fed" stroke-width="2"/>
    <text x="48" y="220" font-size="15" fill="#14193a">22</text>

    <text x="32" y="266" font-size="13" font-weight="600" fill="#14193a">Your country</text>
    <rect x="32" y="278" width="316" height="44" rx="14" fill="#fbfcff" stroke="#e6e9f5" stroke-width="2"/>
    <text x="48" y="306" font-size="15" fill="#14193a">🇮🇹 Italy</text>

    <text x="32" y="352" font-size="13" font-weight="600" fill="#14193a">Interests</text>
    <g font-size="12" font-weight="600">
      <rect x="32" y="364" width="78" height="30" rx="15" fill="#003399"/><text x="71" y="384" text-anchor="middle" fill="#fff">Climate</text>
      <rect x="118" y="364" width="60" height="30" rx="15" fill="#003399"/><text x="148" y="384" text-anchor="middle" fill="#fff">Arts</text>
      <rect x="186" y="364" width="92" height="30" rx="15" fill="#fff" stroke="#e6e9f5" stroke-width="2"/><text x="232" y="384" text-anchor="middle" fill="#4a5170">Digital</text>
      <rect x="286" y="364" width="62" height="30" rx="15" fill="#fff" stroke="#e6e9f5" stroke-width="2"/><text x="317" y="384" text-anchor="middle" fill="#4a5170">Sport</text>
    </g>

    <rect x="32" y="416" width="316" height="50" rx="14" fill="url(#gbtn)"/>
    <text x="190" y="447" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Find my matches  →</text>
  </g>

  <!-- ===== Swipe card ===== -->
  <g transform="translate(470,110)">
    <!-- stacked cards behind -->
    <rect x="40" y="20" width="300" height="470" rx="22" fill="#fff" opacity="0.5" filter="url(#sh)"/>
    <rect x="30" y="12" width="320" height="478" rx="22" fill="#fff" opacity="0.75" filter="url(#sh)"/>
    <!-- top card -->
    <g filter="url(#sh)">
      <rect x="20" y="0" width="340" height="486" rx="22" fill="#fff"/>
      <clipPath id="clip"><rect x="20" y="0" width="340" height="486" rx="22"/></clipPath>
      <g clip-path="url(#clip)">
        <rect x="20" y="0" width="340" height="210" fill="url(#g1)"/>
        <rect x="40" y="20" width="116" height="26" rx="13" fill="#ffffffec"/>
        <text x="98" y="38" font-size="12" font-weight="700" text-anchor="middle" fill="#003399">Youth Exchange</text>
        <text x="40" y="188" font-size="17" font-weight="700" fill="#fff">🇵🇹 Portugal · Sintra</text>
        <text x="330" y="195" font-size="62" text-anchor="end">🌱</text>
      </g>
      <text x="40" y="248" font-size="21" font-weight="700" fill="#14193a">Green Roots: Youth</text>
      <text x="40" y="274" font-size="21" font-weight="700" fill="#14193a">for Climate</text>

      <g font-size="11.5" font-weight="600">
        <rect x="40" y="290" width="112" height="26" rx="13" fill="#f4f6ff"/><text x="96" y="307" text-anchor="middle" fill="#4a5170">🗓️ 12–19 Sep</text>
        <rect x="160" y="290" width="70" height="26" rx="13" fill="#f4f6ff"/><text x="195" y="307" text-anchor="middle" fill="#4a5170">⏳ 8 days</text>
        <rect x="238" y="290" width="78" height="26" rx="13" fill="#e7f8f0"/><text x="277" y="307" text-anchor="middle" fill="#128a5c">💶 Funded</text>
        <rect x="40" y="324" width="108" height="26" rx="13" fill="#fff4cc"/><text x="94" y="341" text-anchor="middle" fill="#9a6b00">⭐ Great match</text>
      </g>

      <text x="40" y="376" font-size="13" fill="#4a5170">Plant ideas and trees with 30 young people</text>
      <text x="40" y="396" font-size="13" fill="#4a5170">from 6 countries. Workshops on sustainability</text>
      <text x="40" y="416" font-size="13" fill="#4a5170">and youth-led climate action.</text>

      <g font-size="11" font-weight="600" fill="#003399">
        <rect x="40" y="436" width="74" height="24" rx="8" fill="#eaf0ff"/><text x="77" y="452" text-anchor="middle">#Climate</text>
        <rect x="122" y="436" width="94" height="24" rx="8" fill="#eaf0ff"/><text x="169" y="452" text-anchor="middle">#Volunteering</text>
      </g>
    </g>

    <!-- action buttons -->
    <g transform="translate(0,500)">
      <circle cx="118" cy="30" r="28" fill="#fff" filter="url(#sh)"/><text x="118" y="40" font-size="26" text-anchor="middle" fill="#ff5a76">✗</text>
      <circle cx="190" cy="28" r="22" fill="#fff" filter="url(#sh)"/><text x="190" y="36" font-size="18" text-anchor="middle" fill="#2f6fed">ⓘ</text>
      <circle cx="262" cy="30" r="28" fill="#fff" filter="url(#sh)"/><text x="262" y="40" font-size="24" text-anchor="middle" fill="#2ecc8f">♥</text>
    </g>
  </g>

  <text x="450" y="628" font-size="12" text-anchor="middle" fill="#4a5170">Erasmatch+ · concept mockup · Co-funded by imagination 💙💛</text>
</svg>
